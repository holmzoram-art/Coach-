<title>Ukesmat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --ground:#FAFAF7; --surface:#FFFFFF; --surface-2:#F1F1EB;
  --ink:#181A17; --ink-2:#4A4E47; --ink-3:#6E7268;
  --line:#DEDED6; --line-2:#C9C9BF;
  --accent:#356B4E; --accent-soft:#E4EDE7; --accent-ink:#22462F;
  --warn:#B4472B; --warn-soft:#F7E6E0;
  --note:#8A6D1F; --note-soft:#F5EEDA;
  --shadow:0 1px 2px rgba(24,26,23,.06), 0 6px 20px rgba(24,26,23,.05);
  color-scheme:light;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#14170F; --surface:#1C201A; --surface-2:#232821;
    --ink:#EDEFE8; --ink-2:#B9BDB2; --ink-3:#8B9084;
    --line:#31372D; --line-2:#454C40;
    --accent:#7FBF9A; --accent-soft:#1E3328; --accent-ink:#A9D9BE;
    --warn:#E68A6C; --warn-soft:#3A2019;
    --note:#D6B85C; --note-soft:#332C15;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#14170F; --surface:#1C201A; --surface-2:#232821;
  --ink:#EDEFE8; --ink-2:#B9BDB2; --ink-3:#8B9084;
  --line:#31372D; --line-2:#454C40;
  --accent:#7FBF9A; --accent-soft:#1E3328; --accent-ink:#A9D9BE;
  --warn:#E68A6C; --warn-soft:#3A2019;
  --note:#D6B85C; --note-soft:#332C15;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;text-wrap:balance;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:760px;margin:0 auto;padding:18px 16px 108px}

/* ---- topp ---- */
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
header.top h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.fase{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* ---- kort ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---- dagtype ---- */
.daghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dagnavn{font-family:Archivo,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em}
.pill{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.hard{background:var(--accent-soft);color:var(--accent-ink)}
.pill.lang{background:var(--note-soft);color:var(--note)}

/* ---- luker ---- */
.luker{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--line)}
.luke{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;
  min-height:56px;padding:9px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.luke:last-child{border-bottom:none}
.luke .kl{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.luke .navn{font-size:17px}
.luke .navn small{display:block;color:var(--ink-3);font-size:13.5px;line-height:1.35}
.luke .tom{color:var(--ink-3);font-style:italic}
.luke .chev{color:var(--ink-3);font-size:19px;line-height:1}
.luke.na{background:var(--accent-soft);border-radius:8px;padding-left:8px;padding-right:8px}
.luke.laast{cursor:default}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:6px;vertical-align:middle}
.dot.warn{background:var(--warn)}
.dot.note{background:var(--note)}
.anslag{border:1px dashed var(--line-2);border-radius:8px;padding:2px 7px;font-size:12px;color:var(--ink-3)}

/* ---- makrostripe ---- */
.makro{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid var(--line);margin-top:2px}
.mfelt{padding:13px 12px;border-right:1px solid var(--line);text-align:left}
.mfelt:last-child{border-right:none}
.mlab{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mval{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.02em}
.mval small{font-size:13px;font-weight:400;color:var(--ink-3)}
.bar{height:5px;border-radius:3px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar i.warn{background:var(--warn)}
.band{display:flex;gap:3px;margin-top:8px}
.band span{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.band span.on{background:var(--accent)}
.band span.on.warn{background:var(--warn)}
.band span.krav{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.bandtxt{font-size:13px;color:var(--ink-3);margin-top:5px}

/* ---- meldinger ---- */
.melding{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:9px;font-size:15.5px;line-height:1.4}
.melding.rod{background:var(--warn-soft);color:var(--warn)}
.melding.gul{background:var(--note-soft);color:var(--note)}
.melding.rolig{background:var(--surface-2);color:var(--ink-2)}
.melding b{font-weight:600}
.meldinger{display:flex;flex-direction:column;gap:7px;padding:13px 16px 16px}

/* ---- ukestripe ---- */
.uke{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.ukedag{padding:9px 2px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);text-align:center}
.ukedag.valgt{border-color:var(--accent);background:var(--accent-soft)}
.ukedag .d{font-family:Archivo,sans-serif;font-weight:600;font-size:13px}
.ukedag .t{font-size:10.5px;color:var(--ink-3);margin-top:2px;letter-spacing:.03em}
.ukedag .s{width:7px;height:7px;border-radius:50%;margin:6px auto 0;background:var(--line-2)}
.ukedag .s.ok{background:var(--accent)}
.ukedag .s.warn{background:var(--warn)}
.ukedag .s.del{background:var(--line-2);box-shadow:inset 0 0 0 2px var(--accent)}

/* ---- knapper ---- */
.knapper{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 15px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);
  font-size:15px;font-weight:600;min-height:44px}
.btn.primar{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.primar,
:root:not([data-theme="light"]) .btn.primar{color:#0F1A13}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primar{color:#fff}}
.btn:disabled{opacity:.45;cursor:default}

/* ---- meny ---- */
.seksjon-tit{font-family:Archivo,sans-serif;font-weight:700;font-size:15px;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-3);margin:22px 0 9px}
.rett{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:start}
.rett:last-child{border-bottom:none}
.rett h3{font-size:16.5px;font-weight:600;font-family:"Source Sans 3",sans-serif}
.rett p{margin:3px 0 0;font-size:14.5px;color:var(--ink-3)}
.rett .tall{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums}
.merker{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.merke{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);letter-spacing:.02em}
.merke.regel{background:var(--note-soft);color:var(--note)}
.hjerte{font-size:20px;line-height:1;padding:6px;color:var(--line-2)}
.hjerte.pa{color:var(--warn)}
.prinsipp{background:var(--surface-2);border-radius:10px;padding:14px 16px;font-size:15.5px}
.prinsipp h3{font-family:Archivo,sans-serif;font-size:15px;margin-bottom:6px}
.prinsipp ul{margin:6px 0 0;padding-left:19px}
.prinsipp li{margin:3px 0}

/* ---- ark ---- */
.ark-bak{position:fixed;inset:0;background:rgba(24,26,23,.42);z-index:40;display:none}
.ark-bak.apen{display:block}
.ark{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:16px 16px 0 0;max-height:86vh;display:none;flex-direction:column;
  box-shadow:0 -8px 32px rgba(0,0,0,.22)}
.ark.apen{display:flex}
.ark-topp{padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:none}
.ark-topp h2{font-size:18px;font-weight:700}
.ark-topp p{margin:3px 0 0;font-size:14px;color:var(--ink-3)}
.ark-liste{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.valg{display:grid;grid-template-columns:1fr auto;gap:10px;width:100%;text-align:left;
  padding:14px 16px;border-bottom:1px solid var(--line);align-items:center;min-height:60px}
.valg:last-child{border-bottom:none}
.valg.aktiv{background:var(--accent-soft)}
.valg.frarad{opacity:.62}
.valg .grunn{font-size:13.5px;color:var(--note);margin-top:4px}
.valg .hake{color:var(--accent);font-size:19px}
.ark-bunn{padding:11px 16px;border-top:1px solid var(--line);flex:none;display:flex;gap:8px}

/* ---- handleliste ---- */
.teller{position:sticky;top:0;z-index:5;background:var(--ground);padding:11px 0 12px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.teller .n{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.teller .u{font-size:13.5px;color:var(--ink-3)}
.avd{margin-top:14px}
.avd-tit{position:sticky;top:52px;background:var(--ground);z-index:4;display:flex;
  justify-content:space-between;align-items:center;padding:7px 2px;
  font-family:Archivo,sans-serif;font-weight:700;font-size:13px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);width:100%;text-align:left}
.avd-tit .antall{font-family:"IBM Plex Mono",monospace;letter-spacing:0;font-weight:500}
.vare{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:center;width:100%;
  text-align:left;min-height:58px;padding:8px 10px;border-bottom:1px solid var(--line);border-radius:8px}
.vare .boks{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center;font-size:14px;color:transparent}
.vare.av{opacity:.45}
.vare.av .boks{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .vare.av .boks,
:root:not([data-theme="light"]) .vare.av .boks{color:#0F1A13}
.vare.av .navn{text-decoration:line-through}
.vare .navn{font-size:17px}
.vare .mengde{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.vare .kilde{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.angre{position:fixed;left:50%;transform:translateX(-50%);bottom:82px;z-index:30;
  background:var(--ink);color:var(--ground);padding:11px 15px;border-radius:10px;
  font-size:15px;display:none;align-items:center;gap:14px;box-shadow:var(--shadow);white-space:nowrap}
.angre.vis{display:flex}
.angre button{font-weight:700;color:var(--ground);text-decoration:underline}
.leggtil{display:flex;gap:8px;margin-top:16px}
.leggtil input{flex:1;padding:11px 13px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);font:inherit;font-size:16px;min-height:46px}

/* ---- faner ---- */
.faner{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
.fane{padding:13px 4px 15px;font-family:Archivo,sans-serif;font-weight:600;font-size:14px;
  color:var(--ink-3);border-top:2px solid transparent;margin-top:-1px}
.fane.pa{color:var(--accent);border-top-color:var(--accent)}
.fane .tall{font-family:"IBM Plex Mono",monospace;font-size:11.5px;display:block;font-weight:500;opacity:.8}

.banner{background:var(--note-soft);color:var(--note);padding:11px 14px;border-radius:9px;
  font-size:14.5px;margin-bottom:14px}
.kilde{font-size:13px;color:var(--ink-3);margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.skjul{display:none}
</style>

<div class="wrap">
  <header class="top">
    <h1>Ukesmat</h1>
    <span class="fase mono" id="faselab"></span>
  </header>
  <div id="banner"></div>
  <main id="innhold"></main>
  <p class="kilde">Menyer og porsjoner fra <b>matplan.md</b>, måltall fra <b>makrogrunnlag.md</b>.
     Alle tall er anslag fra husholdningsmål — ±15–20 % per måltid. Under langtur gjelder <b>mage.md</b>.</p>
</div>

<div class="ark-bak" id="arkbak"></div>
<div class="ark" id="ark" role="dialog" aria-modal="true" aria-labelledby="arktit">
  <div class="ark-topp"><h2 id="arktit"></h2><p id="arksub"></p></div>
  <div class="ark-liste" id="arkliste"></div>
  <div class="ark-bunn">
    <button class="btn" id="arkfjern">Tøm luka</button>
    <button class="btn" id="arkgjenta">Gjenta hele uka</button>
    <button class="btn primar" style="margin-left:auto" id="arklukk">Lukk</button>
  </div>
</div>

<div class="angre" id="angre"><span id="angretxt"></span><button id="angreknapp">Angre</button></div>

<nav class="faner">
  <button class="fane pa" data-fane="uka">Uka</button>
  <button class="fane" data-fane="meny">Meny</button>
  <button class="fane" data-fane="handle">Handleliste<span class="tall" id="fanetall"></span></button>
</nav>

<script>
"use strict";

/* =========================================================================
   KATALOG — fra coach/ernaering/matplan.md og makrogrunnlag.md
   Endres menyene der, republiseres denne siden.
   p = protein g, k = karbo g, f = fett g (avrundede anslag)
   fm = fettmarkører (avokado / nøtter / olje / ost), matplan § 0c
   ing = [vare, avdeling, porsjoner per innkjøpsenhet, enhetsnavn]
   ========================================================================= */

const AVD = {
  frukt:"Frukt & grønt", brod:"Brød & bakeri", meieri:"Meieri",
  kjott:"Kjøtt & fisk", frys:"Frys", torr:"Tørrvarer & kolonial", annet:"Annet"
};
const AVD_REKKE = ["frukt","brod","meieri","kjott","frys","torr","annet"];

const EGG   = ["Egg","meieri",4,"brett à 12"];
const GROV  = ["Grovbrød","brod",8,"brød"];
const HAVRE = ["Havregryn","torr",25,"kg-pose"];
const BAER  = ["Frosne bær","frys",6,"pose 500 g"];
const FRUKT = ["Frukt","frukt",1,"stk"];
const POTET = ["Poteter","frukt",7,"pose 3 kg"];

const MENYER = {
  frokost:{ tittel:"Frokost", kl:"07:00", valgfri:false, retter:[
    {id:"F1",navn:"Eggerøre + grovbrød",porsjon:"3 egg, skvett melk, 2 skiver, tynt smør",p:30,k:35,f:22,fm:0,
     ing:[EGG,GROV,["Smør","meieri",20,"pakke"],["Melk","meieri",20,"liter"]]},
    {id:"F2",navn:"Stekt egg + grovbrød",porsjon:"3 egg stekt, 2 skiver, tynt smør",p:30,k:30,f:22,fm:0,
     ing:[EGG,GROV,["Smør","meieri",20,"pakke"]]},
    {id:"F3",navn:"Proteinyoghurt + havregryn + bær",porsjon:"1 stort beger, 1 dl havregryn, 1 neve bær",p:40,k:45,f:5,fm:0,merker:["raskest"],
     ing:[["Proteinyoghurt","meieri",1,"beger"],HAVRE,BAER]},
    {id:"F4",navn:"Skyr/kesam + havregryn + bær + nøtter",porsjon:"1 beger, 1 dl havregryn, bær, 1 ss nøtter",p:45,k:40,f:12,fm:1,
     ing:[["Skyr eller kesam","meieri",1,"beger"],HAVRE,BAER,["Nøtter","torr",12,"liten pose 200 g",true]]},
    {id:"F5",navn:"Havregrøt på melk + protein",porsjon:"1 dl havregryn, 3 dl melk, 1 skje protein, bær",p:35,k:45,f:8,fm:0,
     ing:[HAVRE,["Melk","meieri",3,"liter"],["Proteinpulver","torr",25,"boks"],BAER]},
    {id:"F6",navn:"Grovbrød med proteinpålegg",porsjon:"3 skiver + makrell i tomat / skinke / kaviar",p:20,k:45,f:10,fm:0,
     tips:"Eneste frokost under 25 g protein — legg på et egg eller et glass melk.",
     ing:[["Grovbrød","brod",5,"brød"],["Proteinpålegg (makrell, skinke, kaviar, kalkun)","kjott",3,"pakke",false,true]]}
  ]},
  kl14:{ tittel:"Kl. 14", kl:"14:00", valgfri:false, retter:[
    {id:"M1",navn:"Kesam eller cottage cheese + frukt",porsjon:"4 dl beger + frukt eller neve bær",p:45,k:30,f:2,fm:0,
     ing:[["Kesam eller cottage cheese","meieri",1,"beger"],FRUKT]},
    {id:"M2",navn:"Proteinyoghurt + bær",porsjon:"1 stort beger + 1 neve bær",p:35,k:25,f:2,fm:0,merker:["raskest"],
     ing:[["Proteinyoghurt","meieri",1,"beger"],BAER]},
    {id:"M3",navn:"2 kokte egg + frukt",porsjon:"2 egg + 1 frukt",p:12,k:20,f:10,fm:0,
     tips:"Under 15 g protein — legg gjerne på et beger kesam.",
     ing:[["Egg","meieri",6,"brett à 12"],FRUKT]},
    {id:"M4",navn:"YT proteinsjokolademelk + frukt",porsjon:"0,5 l + 1 frukt",p:30,k:70,f:2,fm:0,kunTrening:true,
     ing:[["YT proteinsjokolademelk","meieri",1,"flaske"],FRUKT]},
    {id:"M5",navn:"Knekkebrød + makrell/kylling + gulrot",porsjon:"3 knekkebrød, ½ boks, 1 gulrot",p:12,k:30,f:8,fm:0,
     tips:"Under 15 g protein — legg gjerne på et beger kesam.",
     ing:[["Grovt knekkebrød","torr",8,"pakke"],["Makrell i tomat el. kyllingfilet i skiver","kjott",2,"boks/pakke",false,true],["Gulrot","frukt",10,"pose"]]},
    {id:"M6",navn:"Proteinbar + frukt",porsjon:"1 bar + 1 frukt",p:20,k:40,f:6,fm:0,merker:["raskest"],
     ing:[["Proteinbar","torr",1,"stk"],FRUKT]}
  ]},
  middag:{ tittel:"Middag", kl:"19:00", valgfri:false, retter:[
    {id:"R1",navn:"Panne eller ovn: kylling/svin + poteter + rotgrønnsaker",porsjon:"Protein = håndflate og en halv · karbo 1,5–2 never",p:55,k:90,f:17,fm:1,
     hvile:{p:50,k:55,f:17},
     ing:[["Kylling- eller svinefilet","kjott",2,"pakke 500 g",false,true],POTET,["Rotgrønnsaker","frukt",3,"pose"],["Olivenolje","torr",30,"flaske"]]},
    {id:"R2",navn:"Wok: biff/kylling/reker + grønnsaker + ris",porsjon:"Protein = håndflate og en halv · ris 1,5–2 never",p:55,k:90,f:28,fm:1,
     hvile:{p:55,k:65,f:27},
     ing:[["Biffstrimler, kylling eller reker","kjott",2,"pakke",false,true],["Frossen wokblanding","frys",2,"pose 750 g"],["Ris","torr",8,"kg-pose"],["Soyasaus","torr",30,"flaske"]]},
    {id:"R3",navn:"Gryte eller suppe: kjøttdeig eller linser + mye grønt",porsjon:"Karbodag med brød eller poteter",p:70,k:100,f:26,fm:0,

function iso(d){return d.toISOString().slice(0,10)}
function mandagI(d){const x=new Date(d);const dag=(x.getDay()+6)%7;x.setDate(x.getDate()-dag);x.setHours(12,0,0,0);return x}
function ukeNokkel(d){
  const x=new Date(d); x.setHours(12,0,0,0);
  x.setDate(x.getDate()+3-((x.getDay()+6)%7));
  const uke1=new Date(x.getFullYear(),0,4);
  const n=1+Math.round(((x-uke1)/86400000-3+((uke1.getDay()+6)%7))/7);
  return x.getFullYear()+"-W"+String(n).padStart(2,"0");
}
function datoFor(mandag,i){const x=new Date(mandag);x.setDate(x.getDate()+i);return x}
function faseFor(dato){
  const s=iso(dato);
  for(const f of FASER) if(s>=f.fra&&s<=f.til) return f;
  return FASER[0];
}
function norskDato(d){return d.getDate()+". "+["jan","feb","mars","april","mai","juni","juli","aug","sep","okt","nov","des"][d.getMonth()]}

function les(n,f){try{const v=localStorage.getItem("matplan."+n);return v===null?f:JSON.parse(v)}catch(e){return f}}
function skriv(n,v){try{localStorage.setItem("matplan."+n,JSON.stringify(v))}catch(e){}}

function plan(nokkel){
  if(!planer[nokkel]) planer[nokkel]={dager:{}};
  return planer[nokkel];
}
function dagValg(nokkel,dagId){
  const p=plan(nokkel);
  if(!p.dager[dagId]) p.dager[dagId]={};
  return p.dager[dagId];
}

async function koble(){

  dbOk=true;

      if(h) handle[n]={av:h.av||{}, egne:h.egne||[]};
    }
  }catch(e){}

let lagreTimer=null;
function lagre(nokkel){
  erEksempel=false;

  clearTimeout(lagreTimer);
  lagreTimer=setTimeout(async()=>{
    try{
      await db.doc("uker/"+nokkel).set({dager:plan(nokkel).dager, endret:new Date().toISOString()});
      const h=handle[nokkel]||{av:{},egne:[]};
      await db.doc("handlelister/"+nokkel).set({av:h.av, egne:h.egne});
      await db.doc("preferanser/knut").set({favoritter});
    }catch(e){}

}

/* =========================================================================
   REGNESTYKKET
   ========================================================================= */
function rettFor(id){
  if(!id) return null;
  for(const m of Object.values(MENYER)){ const r=m.retter.find(x=>x.id===id); if(r) return r; }
  return LUNSJ.find(x=>x.id===id)||null;
}
function middagPorsjon(rett,dagId){
  if(!rett) return null;
  if(KARBODAG[dagId]) return {p:rett.p,k:rett.k,f:rett.f};
  if(DAGTYPE[dagId]==="hvile") return rett.hvile||{p:rett.p,k:rett.k,f:rett.f};
  // tir og søn: karbodagsporsjon minus én neve karbo
  return {p:rett.p-4,k:rett.k-37,f:rett.f};
}
function fasteFor(dagId){
  const l=[];
  if(TRENINGSDAG[dagId]) l.push(FAST.banan);
  if(dagId==="man"||dagId==="tor") l.push(FAST.loff2);
  if(dagId==="fre") l.push(FAST.loff3);
  if(dagId==="tir") l.push(FAST.melk);
  else if(TRENINGSDAG[dagId]) l.push(FAST.restitusjon);
  return l;
}
function summer(nokkel,dagId){
  const v=dagValg(nokkel,dagId);
  let p=0,k=0,f=0,fm=0;
  const fr=rettFor(v.frokost); if(fr){p+=fr.p;k+=fr.k;f+=fr.f;fm+=fr.fm||0}
  if(v.avokado){p+=2;k+=2;f+=11;fm+=1}
  const lu=rettFor(v.lunsj||standardLunsj(dagId)); if(lu){p+=lu.p;k+=lu.k;f+=lu.f}
  const m=rettFor(v.kl14); if(m){p+=m.p;k+=m.k;f+=m.f;fm+=m.fm||0}
  const mi=rettFor(v.middag);
  if(mi){const q=middagPorsjon(mi,dagId);p+=q.p;k+=q.k;f+=q.f;fm+=mi.fm||0}
  const kv=rettFor(v.kveld); if(kv){p+=kv.p;k+=kv.k;f+=kv.f;fm+=kv.fm||0}
  for(const x of fasteFor(dagId)){p+=x.p;k+=x.k;f+=x.f}
  return {p,k,f,fm};
}
function standardLunsj(dagId){
  if(dagId==="man"||dagId==="tor"||dagId==="fre") return "L1";
  if(dagId==="ons"||dagId==="lor") return "L3";
  return "L2";
}
function maalFor(mandag,dagId){
  const dato=datoFor(mandag,DAGER.findIndex(d=>d.id===dagId));
  return MAAL[faseFor(dato).id][DAGTYPE[dagId]];
}
/* Karbobånd: Lav < 250 · Middels 250–420 · Høy > 420 */
function baand(g){return g<250?0:(g<=420?1:2)}

function vurder(mandag,dagId){
  const v=dagValg(ukeNokkel(mandag),dagId);
  const s=summer(ukeNokkel(mandag),dagId);
  const m=maalFor(mandag,dagId);
  const meld=[];
  const tomme=["frokost","kl14","middag"].filter(x=>!v[x]);

  if(!v.kl14) meld.push({niva:"rod",txt:"<b>14-måltidet kuttes aldri.</b> Fem timer mellom lunsj og trening er grunnen til at kveldene blir tunge."});
  if(tomme.length && v.kl14) meld.push({niva:"rolig",txt:"Uferdig dag — "+tomme.length+" luke"+(tomme.length>1?"r":"")+" står tom."});

  if(!tomme.length){
    if(s.p<180) meld.push({niva:"rod",txt:"<b>Mangler et proteinmåltid.</b> Et beger kesam eller to egg fikser dette."});
    else if(s.p<200) meld.push({niva:"gul",txt:"Litt lavt på protein. Et beger kesam tar deg over."});

    if(KARBODAG[dagId] && s.k < m.k*0.8)
      meld.push({niva:"rod",txt:dagId==="fre"?"<b>For lite karbo før langturen.</b> Legg på brød til lunsj eller en ekstra porsjon karbo til middag.":"<b>Kvalitetsøkt på for lite karbo.</b> Økta blir dårligere enn den trenger å bli."});
    if(DAGTYPE[dagId]==="hvile" && s.k > m.k+60)
      meld.push({niva:"gul",txt:"Lavdagen er ikke lav."});
    if(s.f<60) meld.push({niva:"gul",txt:"Fettet er lavt. Halv avokado til frokost eller en spiseskje nøtter til kl. 14."});
    else if(s.f>160) meld.push({niva:"gul",txt:"Fett over dagens ramme."});
  }
  if(dagId==="fre"){
    const m14=rettFor(v.kl14);
    if((m14&&m14.fm) || v.avokado)
      meld.push({niva:"rod",txt:"<b>Ikke fett etter kl. 11 i dag.</b> Fett bremser magesekken i timevis, og magen er fortsatt et åpent punkt."});
  }
  return {sum:s,maal:m,meld,tomme};
}
function dagStatus(mandag,dagId){
  const r=vurder(mandag,dagId);
  if(r.tomme.length===3) return "";
  if(r.meld.some(x=>x.niva==="rod")) return "warn";
  if(r.tomme.length) return "del";
  return "ok";
}

/* =========================================================================
   HANDLELISTE
   ========================================================================= */
function byggHandleliste(mandag){
  const nokkel=ukeNokkel(mandag);
  const p=plan(nokkel);
  const poster={};
  function legg(ing,kilde){
    const [vare,avd,perEnhet,enhet,regel,fersk]=ing;
    const n=vare+"|"+enhet;
    if(!poster[n]) poster[n]={id:n,vare,avd,perEnhet,enhet,porsjoner:0,kilder:[],regel:!!regel,fersk:!!fersk};
    poster[n].porsjoner++;
    if(!poster[n].kilder.includes(kilde)) poster[n].kilder.push(kilde);
  }
  let eggPorsjoner=0;
  for(const d of DAGER){
    const v=p.dager[d.id]||{};
    for(const luke of ["frokost","kl14","middag","kveld"]){
      const r=rettFor(v[luke]); if(!r||!r.ing) continue;
      for(const ing of r.ing){ legg(ing,r.id); if(ing[0]==="Egg") eggPorsjoner++; }
    }
    if(v.avokado) legg(["Avokado","frukt",2,"stk"],"tillegg");
  }
  const varer=Object.values(poster).map(x=>{
    let enheter=Math.ceil(x.porsjoner/x.perEnhet);
    if(x.vare==="Egg"&&eggPorsjoner>2) enheter=Math.max(enheter,2);
    const rest=enheter*x.perEnhet-x.porsjoner;
    return {...x,enheter,rest};
  });
  /* Faste poster, uavhengig av valg. makrogrunnlag § 6.5 */
  const faste=[
    ["Bananer","frukt","8 stk"],["Loff","brod","1 brød"],["Syltetøy","torr","1 glass"],
    ["YT Protein restitusjonsdrikk","meieri","5 stk"],["Kaffe","torr","1 pk"],
    ["Te","torr","1 pk"],["Seigmenn til langtur","torr","1 pose"]
  ].map(([vare,avd,mengde])=>({id:"fast|"+vare,vare,avd,mengde,fastPost:true,kilder:[]}));
  return varer.concat(faste);
}
const FASTLAGER=["Olivenolje","Knekkebrød","Tunfisk","Linser","Proteinpulver","Salt og krydder"];

function mengdeTekst(v){
  if(v.mengde) return v.mengde;
  const e=v.enhet;
  if(e==="stk") return v.enheter+" stk";
  return v.enheter+" "+e+(v.enheter>1&&!/à|pose|brett/.test(e)?"":"");
}

    {n:"frokost",kl:"07:00",min:420,tit:"Frokost"},
    {n:"lunsj",  kl:"10:40",min:640,tit:"Lunsj i kantina",laast:true},

  let neste=-1;
  if(erIDag){ for(let i=0;i<luker.length;i++){ if(luker[i].min>=naa){neste=i;break} } }

  let h="";

  /* ukestripe */
  h+='<div class="uke">'+DAGER.map((d,i)=>{
    const st=dagStatus(visUke,d.id);
    const dd=datoFor(visUke,i);
    return '<button class="ukedag'+(d.id===valgtDag?" valgt":"")+'" data-dag="'+d.id+'">'+
      '<div class="d">'+d.kort+'</div><div class="t mono">'+dd.getDate()+'.</div>'+
      '<div class="s '+st+'"></div></button>';
  }).join("")+'</div>';

  h+='<div class="knapper" style="margin:12px 0 16px">'+
     '<button class="btn" id="forrigeuke">← Forrige uke</button>'+
     '<button class="btn" id="nesteuke">Neste uke →</button>'+
     '<button class="btn" id="kopieruke" style="margin-left:auto">Kopier forrige uke</button>'+
     '</div>';

  /* dagkort */
  h+='<section class="card"><div class="pad">';

     (erIDag?'<span class="pill">i dag</span>':'')+'</div>';

  h+='<div class="luker">';

    const erNa = i===neste;

      return;
    }
    if(l.fast){
      const t = valgtDag==="fre" ? "3 skiver loff + syltetøy · banan" :
                (valgtDag==="man"||valgtDag==="tor") ? "2 skiver loff + syltetøy · banan" : "Banan";
      h+='<div class="luke laast'+(erNa?" na":"")+'"><span class="kl">'+l.kl+'</span>'+
         '<span class="navn">'+t+'<small>Fast før økt</small></span><span></span></div>';
      return;
    }
    const r=rettFor(v[l.n]);
    let prikk="";
    if(r){
      const pp = l.n==="middag" ? middagPorsjon(r,valgtDag).p : r.p;
      if(pp<15) prikk='<span class="dot note" title="Kan du peke på proteinet?"></span>';
    }
    h+='<button class="luke'+(erNa?" na":"")+'" data-luke="'+l.n+'">'+
       '<span class="kl">'+l.kl+'</span>'+
       '<span class="navn">'+(r?r.navn+prikk+'<small>'+r.porsjon+'</small>':'<span class="tom">Velg '+l.tit.toLowerCase()+'</span>')+'</span>'+
       '<span class="chev">›</span></button>';
  });
  h+='</div>';

  /* avokado-tillegg */
  h+='<div style="margin-top:12px"><button class="btn" id="avokado">'+
     (v.avokado?"✓ ":"+ ")+'Halv avokado</button>'+
     '<span style="font-size:13.5px;color:var(--ink-3);margin-left:10px">erstatter smøret</span></div>';
  h+='</div>';

  /* makrostripe */
  const m=r.maal, s=r.sum;
  const pAndel=Math.min(100,Math.round(s.p/m.p*100));
  const pWarn=s.p<200;
  const bb=baand(s.k), bk=baand(m.k);
  const kWarn=KARBODAG[valgtDag]&&s.k<m.k*0.8;
  h+='<div class="makro">';
  h+='<div class="mfelt"><div class="mlab">Protein</div>'+
     '<div class="mval">'+s.p+' <small>/ '+m.p+' g</small></div>'+
     '<div class="bar"><i class="'+(pWarn?"warn":"")+'" style="width:'+pAndel+'%"></i></div></div>';
  h+='<div class="mfelt"><div class="mlab">Karbo</div>'+
     '<div class="mval">'+["Lav","Middels","Høy"][bb]+'</div>'+
     '<div class="band">'+[0,1,2].map(i=>'<span class="'+(i<=bb?"on":"")+(kWarn?" warn":"")+(i===bk?" krav":"")+'"></span>').join("")+'</div>'+
     '<div class="bandtxt mono">'+s.k+' g · krav '+["lav","middels","høy"][bk]+'</div></div>';
  h+='<div class="mfelt"><div class="mlab">Fett</div>'+
     '<div class="mval">'+s.f+' <small>g</small></div>'+
     '<div class="bandtxt mono">'+s.fm+' av 3 fettmarkører</div></div>';
  h+='</div>';

  if(r.meld.length){
    h+='<div class="meldinger">'+r.meld.map(x=>'<div class="melding '+x.niva+'">'+x.txt+'</div>').join("")+'</div>';
  }
  h+='</section>';

  /* faseskifte-varsel sju dager før */
  const neste7=new Date(iDag); neste7.setDate(neste7.getDate()+7);
  if(faseFor(neste7).id!==faseFor(iDag).id){
    h+='<div class="banner" style="margin-top:14px">Underskuddet starter 28.09. Karboen halveres onsdag og lørdag, og granolaen går ut.</div>';
  }

  if(valgtDag==="fre"){
    h+='<div class="prinsipp" style="margin-top:14px"><h3>Under langturen</h3>'+
       '<p style="margin:0">Næring under økta styres av <b>mage.md</b>, ikke av denne planen — den endres per test. '+
       'Sportsdrikk med elektrolytter er ute. Seigmenn beholdes.</p></div>';
  }

  innhold.innerHTML=h;

  innhold.querySelectorAll("[data-dag]").forEach(b=>b.onclick=()=>{valgtDag=b.dataset.dag;tegn()});
  innhold.querySelectorAll("[data-luke]").forEach(b=>b.onclick=()=>apneArk(b.dataset.luke));
  innhold.querySelector("#forrigeuke").onclick=()=>{const d=new Date(visUke);d.setDate(d.getDate()-7);visUke=d;hentUke();};
  innhold.querySelector("#nesteuke").onclick=()=>{const d=new Date(visUke);d.setDate(d.getDate()+7);visUke=d;hentUke();};
  innhold.querySelector("#kopieruke").onclick=kopierForrigeUke;
  innhold.querySelector("#avokado").onclick=()=>{
    const vv=dagValg(nokkel,valgtDag); vv.avokado=!vv.avokado; lagre(nokkel); tegn();
  };
}

async function hentUke(){
  const n=ukeNokkel(visUke);
  if(!planer[n] && db){
    try{ const u=await db.doc("uker/"+n).get(); if(u&&u.dager) planer[n]={dager:u.dager}; }catch(e){}
  }
  tegn();
}
async function kopierForrigeUke(){
  const forrige=new Date(visUke); forrige.setDate(forrige.getDate()-7);
  const fn=ukeNokkel(forrige);
  if(!planer[fn] && db){ try{const u=await db.doc("uker/"+fn).get(); if(u&&u.dager) planer[fn]={dager:u.dager};}catch(e){} }
  const kilde=planer[fn];
  if(!kilde || !Object.keys(kilde.dager).length){ alert("Forrige uke er ikke satt opp ennå."); return; }
  planer[ukeNokkel(visUke)]={dager:JSON.parse(JSON.stringify(kilde.dager))};
  lagre(ukeNokkel(visUke)); tegn();
}

/* ---- velg-ark ---- */
function apneArk(luke){
  const nokkel=ukeNokkel(visUke);
  const v=dagValg(nokkel,valgtDag);
  arkKontekst={luke,nokkel};
  const tit=document.getElementById("arktit"), sub=document.getElementById("arksub");
  const liste=document.getElementById("arkliste");
  const dag=DAGER.find(d=>d.id===valgtDag);

  if(luke==="lunsj"){
    tit.textContent="Lunsj i kantina";
    sub.textContent="Tallerkenregelen: halv salat, kvart protein, resten karbo. Riktig porsjon er alt valgt for "+dag.navn.toLowerCase()+".";
    const valgt=v.lunsj||standardLunsj(valgtDag);
    liste.innerHTML=LUNSJ.map(l=>{
      const std=l.id===standardLunsj(valgtDag);
      return '<button class="valg'+(l.id===valgt?" aktiv":"")+'" data-id="'+l.id+'">'+
        '<span><b>'+l.navn+'</b>'+(std?' <span class="merke">standard i dag</span>':'')+
        '<div style="font-size:14px;color:var(--ink-3);margin-top:3px">'+l.porsjon+'</div>'+
        '<div class="tall mono" style="font-size:13px;color:var(--ink-3);margin-top:4px">'+l.p+' g protein · '+l.k+' g karbo · anslag</div></span>'+
        (l.id===valgt?'<span class="hake">✓</span>':'<span></span>')+'</button>';
    }).join("");
    document.getElementById("arkgjenta").classList.add("skjul");
    document.getElementById("arkfjern").classList.add("skjul");
  } else {
    const meny=MENYER[luke];
    tit.textContent=meny.tittel;
    sub.textContent=dag.navn+" — "+dag.tekst.toLowerCase()+". Vi tonet ned det som passer dårlig, men du kan velge det likevel.";
    const sortert=meny.retter.slice().sort((a,b)=>(favoritter.includes(b.id)?1:0)-(favoritter.includes(a.id)?1:0));
    liste.innerHTML=sortert.map(r=>{
      const grunn=frarad(r,luke);
      const q = luke==="middag" ? middagPorsjon(r,valgtDag) : {p:r.p,k:r.k,f:r.f};
      const valgt=v[luke]===r.id;
      return '<button class="valg'+(valgt?" aktiv":"")+(grunn?" frarad":"")+'" data-id="'+r.id+'">'+
        '<span><b>'+r.navn+'</b>'+
        '<div style="font-size:14px;color:var(--ink-3);margin-top:3px">'+r.porsjon+'</div>'+
        '<div class="tall mono" style="font-size:13px;color:var(--ink-3);margin-top:4px">'+q.p+' g protein · '+q.k+' g karbo · '+q.f+' g fett</div>'+
        (r.tips?'<div class="grunn">'+r.tips+'</div>':'')+
        (grunn?'<div class="grunn">'+grunn+'</div>':'')+'</span>'+
        (valgt?'<span class="hake">✓</span>':'<span></span>')+'</button>';
    }).join("");
    document.getElementById("arkgjenta").classList.remove("skjul");
    document.getElementById("arkfjern").classList.remove("skjul");
  }
  document.getElementById("ark").classList.add("apen");
  document.getElementById("arkbak").classList.add("apen");
}
function frarad(r,luke){
  const fase=faseFor(datoFor(visUke,DAGER.findIndex(d=>d.id===valgtDag))).id;
  if(r.kunTrening && !TRENINGSDAG[valgtDag])
    return "Rask karbo uten mottaker på en hviledag.";
  if(r.kunVedlikehold && fase!=="vedlikehold")
    return "Granolaen går ut når underskuddet starter.";
  if(r.kunKarbodag && !KARBODAG[valgtDag])
    return "Full karboporsjon — laget for kvalitets- og langturdager.";
  if(luke==="middag" && !r.hvile && !KARBODAG[valgtDag] && DAGTYPE[valgtDag]==="hvile")
    return "Har ingen hviledagsvariant.";
  if(luke==="kl14" && valgtDag==="fre" && r.fm)
    return "Fett før langturen bremser magesekken.";
  return "";
}
function lukkArk(){
  document.getElementById("ark").classList.remove("apen");
  document.getElementById("arkbak").classList.remove("apen");
  arkKontekst=null;
}
document.getElementById("arkbak").onclick=lukkArk;
document.getElementById("arklukk").onclick=lukkArk;
document.getElementById("arkfjern").onclick=()=>{
  if(!arkKontekst) return;
  delete dagValg(arkKontekst.nokkel,valgtDag)[arkKontekst.luke];
  lagre(arkKontekst.nokkel); lukkArk(); tegn();
};
document.getElementById("arkgjenta").onclick=()=>{
  if(!arkKontekst) return;
  const id=dagValg(arkKontekst.nokkel,valgtDag)[arkKontekst.luke];
  if(!id){ lukkArk(); return; }
  for(const d of DAGER){
    const r=rettFor(id);
    if(arkKontekst.luke==="middag" && !r.hvile && DAGTYPE[d.id]==="hvile") continue;
    if(r.kunTrening && !TRENINGSDAG[d.id]) continue;
    dagValg(arkKontekst.nokkel,d.id)[arkKontekst.luke]=id;
  }
  lagre(arkKontekst.nokkel); lukkArk(); tegn();
};
document.getElementById("arkliste").onclick=(e)=>{
  const b=e.target.closest("[data-id]"); if(!b||!arkKontekst) return;
  const v=dagValg(arkKontekst.nokkel,valgtDag);
  if(arkKontekst.luke==="lunsj") v.lunsj=b.dataset.id;
  else v[arkKontekst.luke]=b.dataset.id;
  lagre(arkKontekst.nokkel); lukkArk(); tegn();
};

/* ---- meny ---- */
function tegnMeny(){
  let h='<div class="prinsipp"><h3>Fem regler som gjelder uansett hva du velger</h3><ul>'+
    '<li>Protein i hvert eneste måltid — du skal kunne peke på det.</li>'+
    '<li>Kl. 14-måltidet kuttes aldri. Det er femtimershullet som gjør kveldene tunge.</li>'+
    '<li>Karboen følger økta: stor mandag, torsdag og fredag, mindre onsdag og lørdag.</li>'+
    '<li>Fettet erstatter noe — det kommer aldri i tillegg.</li>'+
    '<li>Fredag før langtur: ikke fett etter kl. 11.</li>'+
    '</ul></div>';

  for(const [nokkel,meny] of Object.entries(MENYER)){
    h+='<div class="seksjon-tit">'+meny.tittel+' — '+meny.retter.length+' valg</div>';
    h+='<section class="card">'+meny.retter.map(r=>{
      const fav=favoritter.includes(r.id);
      let merker=(r.merker||[]).slice();
      if(r.kunTrening) merker.push("kun treningsdag");
      if(r.kunKarbodag) merker.push("kun karbodag");
      if(r.kunVedlikehold) merker.push("ut ved underskudd");
      if(r.hvile) merker.push("egen hviledagsporsjon");
      if(r.fm) merker.push("fettmarkør");
      return '<div class="rett"><div>'+
        '<h3>'+r.navn+'</h3><p>'+r.porsjon+'</p>'+
        '<div class="tall">'+r.p+' g protein · '+r.k+' g karbo · '+r.f+' g fett</div>'+
        (r.tips?'<p style="color:var(--note)">'+r.tips+'</p>':'')+
        (merker.length?'<div class="merker">'+merker.map(m=>'<span class="merke">'+m+'</span>').join("")+'</div>':'')+
        '</div><button class="hjerte'+(fav?" pa":"")+'" data-fav="'+r.id+'" aria-label="Favoritt">'+(fav?"♥":"♡")+'</button></div>';
    }).join("")+'</section>';
  }

  h+='<div class="seksjon-tit">Rundt økta — fast, ikke valgfritt</div>';
  h+='<section class="card">'+[
    ["Banan før økt","1 stk · alle øktdager","1 g protein · 25 g karbo"],
    ["2 skiver loff + syltetøy","15:30 mandag og torsdag","6 g protein · 50 g karbo"],
    ["3 skiver loff + syltetøy","13:30 fredag, før langturen","9 g protein · 75 g karbo"],
    ["YT Protein restitusjonsdrikk","Rett etter løpeøkt","30 g protein · 50 g karbo"],
    ["5 dl lettmelk","Etter styrke, tirsdag","17 g protein · 24 g karbo"]
  ].map(([n,p,t])=>'<div class="rett"><div><h3>'+n+'</h3><p>'+p+'</p><div class="tall">'+t+'</div></div><span></span></div>').join("")+'</section>';

  h+='<div class="seksjon-tit">Fettrammen</div>'+
    '<div class="prinsipp"><p style="margin:0">Halv avokado, ikke hel, tre–fire dager i uka — og den <b>erstatter smøret</b>. '+
    'Samme for nøtter (oppmålt) og olje (én skje). Maks tre fettmarkører om dagen. '+
    'Fet fisk to–tre ganger i uka er fettet som gir mest tilbake.</p></div>';

  h+='<div class="seksjon-tit">Kantina</div>'+
    '<div class="prinsipp"><p style="margin:0">Tallerkenregelen: <b>halv tallerken salat og grønnsaker, en kvart protein, resten karbo.</b> '+
    'Karboporsjonen følger dagen — full mandag, torsdag og fredag, halv onsdag og lørdag. '+
    'Du skal ikke gjette hva kantina serverer; velg porsjonen, ikke retten.</p></div>';

  innhold.innerHTML=h;
  innhold.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.fav;
    const i=favoritter.indexOf(id);
    if(i>=0) favoritter.splice(i,1); else favoritter.push(id);
    lagre(ukeNokkel(visUke)); tegn();
  });
}

/* ---- handleliste ---- */
function tegnHandle(){
  const mandag=handleUkeMandag();
  const nokkel=ukeNokkel(mandag);
  if(!handle[nokkel]) handle[nokkel]={av:{},egne:[]};
  const h_=handle[nokkel];
  const sondag=datoFor(mandag,6);
  let varer=byggHandleliste(mandag);
  h_.egne.forEach((e,i)=>varer.push({id:"egen|"+i,vare:e.navn,avd:"annet",mengde:e.mengde||"",egen:true,fast:e.fast,kilder:[]}));

  const total=varer.length, avkrysset=varer.filter(v=>h_.av[v.id]).length;
  let h='<div class="teller"><span class="n">'+avkrysset+' av '+total+'</span>'+
        '<span class="u">Uke '+nokkel.slice(6)+' · '+norskDato(mandag)+'–'+norskDato(sondag)+'</span></div>';

  if(!total){
    h+='<div class="prinsipp" style="margin-top:16px"><p style="margin:0">Ingen retter valgt for denne uka ennå. Sett opp uka under <b>Uka</b>, så bygger lista seg selv.</p></div>';
  }

  for(const avd of AVD_REKKE){
    const iAvd=varer.filter(v=>v.avd===avd);
    if(!iAvd.length) continue;
    const ferdig=iAvd.every(v=>h_.av[v.id]);
    const gjort=iAvd.filter(v=>h_.av[v.id]).length;
    h+='<div class="avd"><button class="avd-tit" data-avd="'+avd+'">'+AVD[avd]+
       '<span class="antall">'+gjort+' av '+iAvd.length+(ferdig?" ✓":"")+'</span></button>';
    if(!ferdig || h_.apen===avd){
      const sortert=iAvd.slice().sort((a,b)=>(h_.av[a.id]?1:0)-(h_.av[b.id]?1:0));
      h+=sortert.map(v=>{
        const av=!!h_.av[v.id];
        const kilder=v.kilder&&v.kilder.length?v.kilder.join(", "):"";
        return '<button class="vare'+(av?" av":"")+'" data-vare="'+v.id+'">'+
          '<span class="boks">✓</span>'+
          '<span><span class="navn">'+v.vare+'</span>'+
          (kilder?'<span class="kilde">'+kilder+(v.rest>0?' · '+v.rest+' porsjon'+(v.rest>1?'er':'')+' til overs':'')+'</span>':'')+
          (v.regel?'<span class="kilde">Alltid liten pose — det som er hjemme, blir spist.</span>':'')+
          (v.fersk?'<span class="kilde">Sjekk holdbarhetsdato.</span>':'')+
          '</span><span class="mengde">'+(mengdeTekst(v)||"")+'</span></button>';
      }).join("");
    }
    h+='</div>';
  }

  h+='<div class="avd"><div class="avd-tit">Fast lager — sjekk om du har</div>'+
     FASTLAGER.map(x=>'<div class="vare" style="opacity:.75"><span></span><span class="navn">'+x+'</span><span></span></div>').join("")+'</div>';

  h+='<form class="leggtil" id="leggtil"><input id="nyvare" placeholder="Legg til en vare" autocomplete="off">'+
     '<button class="btn primar" type="submit">Legg til</button></form>';

  innhold.innerHTML=h;

  innhold.querySelectorAll("[data-vare]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.vare;
    h_.av[id]=!h_.av[id];
    sisteAngre={nokkel,id};
    visAngre(h_.av[id]?"Krysset av":"Angret avkryssing");
    lagre(nokkel); tegnHandle();
  });
  innhold.querySelectorAll("[data-avd]").forEach(b=>b.onclick=()=>{
    h_.apen = h_.apen===b.dataset.avd ? null : b.dataset.avd; tegnHandle();
  });
  const skjema=innhold.querySelector("#leggtil");
  if(skjema) skjema.onsubmit=(e)=>{
    e.preventDefault();
    const inp=innhold.querySelector("#nyvare");
    const t=inp.value.trim(); if(!t) return;
    h_.egne.push({navn:t}); inp.value="";
    lagre(nokkel); tegnHandle();
  };
}

function visAngre(txt){
  const el=document.getElementById("angre");
  document.getElementById("angretxt").textContent=txt;
  el.classList.add("vis");
  clearTimeout(angreTid);
  angreTid=setTimeout(()=>el.classList.remove("vis"),5000);
}
document.getElementById("angreknapp").onclick=()=>{
  if(!sisteAngre) return;
  const {nokkel,id}=sisteAngre;
  handle[nokkel].av[id]=!handle[nokkel].av[id];
  document.getElementById("angre").classList.remove("vis");
  lagre(nokkel); tegnHandle();
};

document.querySelectorAll(".fane").forEach(b=>b.onclick=()=>{
  fane=b.dataset.fane; skriv("fane",fane); tegn();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") lukkArk(); });

/* Startvisning: en uke som allerede er satt opp, så siden viser hva den gjør */
(function frø(){
  const n=ukeNokkel(visUke);
  planer[n]={dager:{
    man:{frokost:"F3",kl14:"M4",middag:"R5",kveld:"K1"},
    tir:{frokost:"F1",kl14:"M1",middag:"R1",kveld:"K5"},
    ons:{frokost:"F4",kl14:"M2",middag:"R3",kveld:"K2",avokado:true},
    tor:{frokost:"F3",kl14:"M4",middag:"R2",kveld:"K1"},
    fre:{frokost:"F5",kl14:"M2",middag:"R4",kveld:"K1"},
    lor:{frokost:"F1",kl14:"M1",middag:"R6",kveld:"K2"},
    son:{frokost:"F6",kl14:"M6",middag:"R1",kveld:"K6"}
  }};
})();

tegn();
koble();
</script>
